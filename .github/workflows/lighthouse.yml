# Calidad en cada PR a main y en cada push a main (que Cloudflare publica):
# los checks propios (i18n, tipos y SEO del build) y Lighthouse móvil con el
# presupuesto de lighthouserc.yml. Si algo no cumple, el check falla.
name: Calidad

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run check
      - run: npm run build
      - run: npm run check:seo
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.yml
          uploadArtifacts: true
